<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#fff;font-family:sans-serif}</style>
<script>
  // 三个页面共用:按文件名取脚本,A 先加载 Monaco 的样式表
  const n = location.pathname.split('/').pop().replace('.html', '')
  const go = () => { const s = document.createElement('script'); s.src = n + '.js'; document.head.appendChild(s) }
  if (n.startsWith('react-a')) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = n + '.css'; l.onload = l.onerror = go; document.head.appendChild(l) }
  else go()
</script>
</head>
<body>
<div id="host" style="position:absolute;left:0;top:0;width:800px;height:400px;display:flex"></div>
</body>
</html>
