<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Monaco vs lite-monaco CM7 — 观感对齐</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; padding: 24px; }
        h1 { font-size: 18px; margin-bottom: 4px; }
        .tag { color: #7d8590; font-size: 13px; margin-bottom: 16px; }
        .bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        button { background: #21262d; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
        button:hover { background: #30363d; }
        button:disabled { opacity: 0.5; cursor: default; }
        button.doc-btn.active { border-color: #58a6ff; color: #58a6ff; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .col { min-width: 0; }
        .col h2 { font-size: 13px; color: #7d8590; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .col h2 span { font-size: 11px; padding: 2px 6px; background: #21262d; border-radius: 4px; }
        .frame { border: 1px solid #30363d; border-radius: 10px; overflow: hidden; height: 520px; }
        #monaco-host, #cm7-host { height: 100%; }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; margin-bottom: 16px; }
        .feature { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7d8590; }
        .feature input { accent-color: #238636; }
        .feature.on { color: #e6edf3; }
    </style>
</head>
<body>
    <h1>Monaco vs lite-monaco CM7 — 观感对齐</h1>
    <div class="tag">同代码、同主题(vs-dark)、同字号、同操作。左 Monaco,右 lite-monaco 自研 CM7 内核。逐特性对照:高亮、括号着色、缩进参考线、minimap、overview ruler、选区高亮、折叠。</div>

    <div class="bar">
        <button id="sync-scroll">同步滚动: ON</button>
        <span style="color:#7d8590;font-size:12px;margin-left:4px">文档:</span>
        <button type="button" id="doc-sample" class="doc-btn active">样本 ~460 行</button>
        <button type="button" id="doc-10k" class="doc-btn">~1.1 万行</button>
        <button type="button" id="doc-30k" class="doc-btn">~3 万行</button>
        <button type="button" id="doc-50k" class="doc-btn">~5 万行</button>
        <span id="doc-status" style="color:#d29922;font-size:12px;margin-left:8px"></span>
    </div>

    <div class="feature-grid">
        <label class="feature on"><input type="checkbox" id="f-linenumbers" checked> 行号</label>
        <label class="feature on"><input type="checkbox" id="f-minimap" checked> minimap</label>
        <label class="feature on"><input type="checkbox" id="f-brackets" checked> 括号着色</label>
        <label class="feature on"><input type="checkbox" id="f-indent" checked> 缩进参考线</label>
        <label class="feature on"><input type="checkbox" id="f-selection" checked> 选区高亮</label>
        <label class="feature on"><input type="checkbox" id="f-folding" checked> 代码折叠</label>
    </div>

    <div class="grid">
        <div class="col">
            <h2>Monaco Editor <span>~2.8MB</span></h2>
            <div class="frame"><div id="monaco-host"></div></div>
        </div>
        <div class="col">
            <h2>lite-monaco CM7 <span>自研内核 + Shiki</span></h2>
            <div class="frame"><div id="cm7-host"></div></div>
        </div>
    </div>

    <script type="module" src="./compare-cm7.ts"></script>
</body>
</html>
